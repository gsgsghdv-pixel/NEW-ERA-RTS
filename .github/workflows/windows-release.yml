name: NEW ERA RTS - Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter "Godot_v4.7.2-stable_win64.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Godot executable not found" }
          "GODOT=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\templates.tpz"
          $dest = "$env:APPDATA\Godot\export_templates\4.7.2.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\templates.tpz" -DestinationPath "$env:RUNNER_TEMP\templates" -Force
          $root = Get-ChildItem "$env:RUNNER_TEMP\templates" -Directory | Select-Object -First 1
          if ($root) { Copy-Item "$($root.FullName)\*" $dest -Recurse -Force } else { Copy-Item "$env:RUNNER_TEMP\templates\*" $dest -Recurse -Force }

      - name: Static QA
        shell: pwsh
        run: python scripts\qa_check.py

      - name: Validate project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "godot-validate.log"
          & "$env:GODOT" --headless --path . --editor --quit 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          Write-Host "Godot validation exit code: $exitCode"
          $output = Get-Content $log -Raw -ErrorAction SilentlyContinue
          if ($exitCode -ne 0 -or $output -match "SCRIPT ERROR|Parse Error|Failed to load script") { throw "Godot project validation failed: script/parse error detected" }

      - name: Gameplay smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "gameplay-smoke.log"
          & "$env:GODOT" --headless --path . --script scripts/gameplay_smoke.gd 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          Write-Host "Gameplay smoke exit code: $exitCode"
          $output = Get-Content $log -Raw -ErrorAction SilentlyContinue
          if ($exitCode -ne 0 -or $output -match "SCRIPT ERROR|Parse Error|Failed to load script") { throw "Gameplay smoke test failed: script/parse error detected" }

      - name: Deep systems QA
        shell: pwsh
        run: python scripts\deep_system_qa.py

      - name: LAN two-process E2E smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hostLog = Join-Path $env:RUNNER_TEMP "lan-host.log"
          $clientLog = Join-Path $env:RUNNER_TEMP "lan-client.log"
          $hostProc = Start-Process -FilePath "$env:GODOT" -ArgumentList @('--headless','--path','.','--script','scripts/lan_e2e_smoke.gd','--','--role=host') -PassThru -RedirectStandardOutput $hostLog -RedirectStandardError "$hostLog.err"
          Start-Sleep -Seconds 2
          $clientProc = Start-Process -FilePath "$env:GODOT" -ArgumentList @('--headless','--path','.','--script','scripts/lan_e2e_smoke.gd','--','--role=client') -PassThru -RedirectStandardOutput $clientLog -RedirectStandardError "$clientLog.err"
          if (-not $clientProc.WaitForExit(15000)) { Stop-Process -Id $clientProc.Id -Force; throw "LAN client E2E timed out" }
          if (-not $hostProc.WaitForExit(5000)) { Stop-Process -Id $hostProc.Id -Force; throw "LAN host E2E timed out" }
          Get-Content $hostLog -ErrorAction SilentlyContinue
          Get-Content "$hostLog.err" -ErrorAction SilentlyContinue
          Get-Content $clientLog -ErrorAction SilentlyContinue
          Get-Content "$clientLog.err" -ErrorAction SilentlyContinue
          $allLanOutput = ((Get-Content $hostLog -Raw -ErrorAction SilentlyContinue) + (Get-Content "$hostLog.err" -Raw -ErrorAction SilentlyContinue) + (Get-Content $clientLog -Raw -ErrorAction SilentlyContinue) + (Get-Content "$clientLog.err" -Raw -ErrorAction SilentlyContinue))
          if ($allLanOutput -match "SCRIPT ERROR|Parse Error|Failed to load script") { throw "LAN E2E failed: script/parse error detected" }
          if ($clientProc.ExitCode -ne 0) { throw "LAN client E2E failed with exit code $($clientProc.ExitCode)" }
          if ($hostProc.ExitCode -ne 0) { throw "LAN host E2E failed with exit code $($hostProc.ExitCode)" }
          Write-Host "LAN two-process E2E: PASS"

      - name: Export Windows x86_64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "godot-export.log"
          & "$env:GODOT" --headless --path . --export-release "Windows Desktop" "build\NEW_ERA_RTS.exe" 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          Write-Host "Godot export exit code: $exitCode"
          Get-ChildItem build -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length
          $output = Get-Content $log -Raw -ErrorAction SilentlyContinue
          if ($exitCode -ne 0 -or $output -match "SCRIPT ERROR|Parse Error|Failed to load script") { throw "Windows export failed: script/parse error detected" }
          if (-not (Test-Path "build\NEW_ERA_RTS.exe")) { throw "EXE was not produced" }
          if (-not (Test-Path "build\NEW_ERA_RTS.pck")) { throw "PCK was not produced" }

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process -FilePath "build\NEW_ERA_RTS.exe" -ArgumentList @('--headless','--quit-after','3') -PassThru -NoNewWindow
          if (-not $p.WaitForExit(15000)) {
            Stop-Process -Id $p.Id -Force
            throw "Runtime smoke test timed out"
          }
          Write-Host "Runtime smoke test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Runtime smoke test failed" }

      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-FileHash "build\NEW_ERA_RTS.exe" -Algorithm SHA256 | Format-List | Out-File "build\SHA256_EXE.txt"
          Get-FileHash "build\NEW_ERA_RTS.pck" -Algorithm SHA256 | Format-List | Out-File "build\SHA256_PCK.txt"
          Get-FileHash "build\NEW_ERA_RTS.exe" -Algorithm SHA256
          Get-FileHash "build\NEW_ERA_RTS.pck" -Algorithm SHA256

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "build\*" -DestinationPath "NEW_ERA_RTS_Windows_x86_64.zip" -Force
          if (-not (Test-Path "NEW_ERA_RTS_Windows_x86_64.zip")) { throw "ZIP package was not produced" }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEW_ERA_RTS-Windows-x86_64
          path: build/NEW_ERA_RTS.exe

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NEW_ERA_RTS-Windows-Package
          path: NEW_ERA_RTS_Windows_x86_64.zip
